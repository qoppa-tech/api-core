upstream file_storage_backend {
  server 127.0.0.1:8080;
}

limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name file-storage.local;

  root /var/www/file_storage;
  access_log /var/log/nginx/file_storage.access.log;
  error_log  /var/log/nginx/file_storage.error.log warn;

  client_max_body_size 10G;
  client_body_temp_path /var/lib/nginx/body 1 2;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options "DENY";
  add_header X-XSS-Protection "1; mode=block";

  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  limit_conn conn_per_ip 10;
  limit_req zone=req_per_ip burst=20 nodelay;

  location /files/ {
    alias /var/www/file_storage/files/;
    autoindex off;

    try_files $uri =404;

    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";

    add_header Accept-Ranges bytes;

    location ~* \.(php|pl|py|sh|cgi)$ {
      deny all;
      return 404;
    }
  }

  location /protected/ {
    internal;
    alias /var/www/file_storage/protected/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header Accept-Ranges bytes;
  }

  location /upload/ {
    proxy_pass http://file_storage_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 1200s;
    proxy_read_timeout 1200s;
  }

  location = /healthz {
    access_log off;
    return 200 "OK\n";
  }

  location ~ /\.(git|env|htpasswd|htaccess)$ {
    deny all;
    return 404;
  }

}
