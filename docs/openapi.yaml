openapi: 3.1.0
info:
  title: Parlor API
  description: API for Parlor salon management and appointment booking system
  version: 1.0.0
  contact:
    name: Parlor Harpia API Docs
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication endpoints
  - name: SSO
    description: Single Sign-On (OAuth2) endpoints
  - name: Profile
    description: User profile endpoints
  - name: Contact Form
    description: Contact form endpoints
  - name: Onboarding
    description: User onboarding endpoints
  - name: Clients
    description: Client management endpoints
  - name: Appointments
    description: Appointment management endpoints
  - name: Salons
    description: Salon management endpoints
  - name: Services
    description: Service management endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API and database
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "up"
                  message:
                    type: string
                    example: "It's healthy"

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request - invalid input
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user and returns a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the currently authenticated user's information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  /profile:
    get:
      tags:
        - Profile
      summary: Get user profile
      description: Returns the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
    patch:
      tags:
        - Profile
      summary: Update user profile
      description: Updates the authenticated user's profile information. At least one field must be provided.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Bad request - invalid input or no fields provided
        '401':
          description: Unauthorized
        '409':
          description: Email already in use

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Invalidates the current JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Uses the refresh token cookie to issue a new access token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token not found or invalid

  /auth/google:
    get:
      tags:
        - SSO
      summary: Google OAuth2 login
      description: Redirects to Google OAuth2 consent page
      responses:
        '307':
          description: Redirect to Google OAuth2

  /auth/google/callback:
    get:
      tags:
        - SSO
      summary: Google OAuth2 callback
      description: Handles the OAuth2 callback from Google
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '307':
          description: |
            Redirect to frontend with onboarding status.
            Redirect URL format: {FRONTEND_URL}/auth/callback?onboardingCompleted={true|false}&onboardingStep={step_id}
            - onboardingCompleted: Whether the user has completed onboarding
            - onboardingStep: Current onboarding step ID (only present if user has started onboarding)
        '400':
          description: Missing authorization code
        '500':
          description: Failed to exchange token or get user info

  /contact-form:
    post:
      tags:
        - Contact Form
      summary: Submit contact form
      description: Creates a new contact form submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormRequest'
      responses:
        '201':
          description: Contact form submitted successfully
        '400':
          description: Bad request - invalid input
    get:
      tags:
        - Contact Form
      summary: List contact forms
      description: Returns all contact form submissions
      responses:
        '200':
          description: List of contact forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactFormResponse'

  /onboarding:
    get:
      tags:
        - Onboarding
      summary: Get onboarding steps and user progress
      description: Returns all onboarding steps with their options and the user's current progress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgressResponse'
        '401':
          description: Unauthorized
    post:
      tags:
        - Onboarding
      summary: Save onboarding selections (batch)
      description: Saves multiple onboarding steps at once. Use POST /onboarding/step for single-step saves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOnboardingRequest'
      responses:
        '200':
          description: Onboarding selections saved successfully
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized

  /onboarding/step:
    post:
      tags:
        - Onboarding
      summary: Save single onboarding step (performant)
      description: |
        Saves a single onboarding step with its selections in a single transaction.
        More performant than batch endpoint for step-by-step onboarding flow.
        Sets is_last_step=true on the final step to mark onboarding as completed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOnboardingStepRequest'
      responses:
        '200':
          description: Step saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "step saved successfully"
                  step_id:
                    type: integer
                    example: 2
                  completed:
                    type: boolean
                    example: false
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized

  # ==================== CLIENTS ====================
  /clients:
    post:
      tags:
        - Clients
      summary: Create a new client
      description: Creates a new client for a salon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized
    get:
      tags:
        - Clients
      summary: List clients by salon
      description: Returns all clients for a specific salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Salon ID to filter clients
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Bad request - missing or invalid salon_id
        '401':
          description: Unauthorized

  /clients/search:
    get:
      tags:
        - Clients
      summary: Search clients
      description: Search clients by name or phone within a salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (name or phone)
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /clients/by-phone:
    get:
      tags:
        - Clients
      summary: Get client by phone
      description: Find a client by phone number within a salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Client not found

  /clients/{id}:
    get:
      tags:
        - Clients
      summary: Get client by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Invalid client ID
        '401':
          description: Unauthorized
        '404':
          description: Client not found
    patch:
      tags:
        - Clients
      summary: Update client
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Client not found
    delete:
      tags:
        - Clients
      summary: Delete client
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Client deleted
        '400':
          description: Invalid client ID
        '401':
          description: Unauthorized

  # ==================== APPOINTMENTS ====================
  /appointments:
    post:
      tags:
        - Appointments
      summary: Create a new appointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      tags:
        - Appointments
      summary: List appointments by salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/by-date:
    get:
      tags:
        - Appointments
      summary: List appointments by date
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date in YYYY-MM-DD format
      responses:
        '200':
          description: Appointments for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/by-date-range:
    get:
      tags:
        - Appointments
      summary: List appointments by date range
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Appointments in date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/by-user:
    get:
      tags:
        - Appointments
      summary: List appointments by user (professional)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/by-status:
    get:
      tags:
        - Appointments
      summary: List appointments by status
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [pending, confirmed, cancelled, done, no-show]
      responses:
        '200':
          description: Appointments with status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/by-client-phone:
    get:
      tags:
        - Appointments
      summary: List appointments by client phone
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Client's appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/count:
    get:
      tags:
        - Appointments
      summary: Count appointments by user and date
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Appointment count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /appointments/{id}:
    get:
      tags:
        - Appointments
      summary: Get appointment by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Invalid appointment ID
        '401':
          description: Unauthorized
        '404':
          description: Appointment not found
    patch:
      tags:
        - Appointments
      summary: Update appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Appointment not found
    delete:
      tags:
        - Appointments
      summary: Delete appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Appointment deleted
        '400':
          description: Invalid appointment ID
        '401':
          description: Unauthorized

  /appointments/{id}/status:
    patch:
      tags:
        - Appointments
      summary: Update appointment status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Appointment not found

  # ==================== SALONS ====================
  /salons:
    post:
      tags:
        - Salons
      summary: Create a new salon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalonRequest'
      responses:
        '201':
          description: Salon created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      tags:
        - Salons
      summary: List all salons
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of salons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalonResponse'
        '401':
          description: Unauthorized

  /salons/by-slug:
    get:
      tags:
        - Salons
      summary: Get salon by slug
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Salon details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Salon not found

  /salons/by-owner:
    get:
      tags:
        - Salons
      summary: Get salon by owner ID
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Salon details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Salon not found

  /salons/{id}:
    get:
      tags:
        - Salons
      summary: Get salon by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Salon details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonResponse'
        '400':
          description: Invalid salon ID
        '401':
          description: Unauthorized
        '404':
          description: Salon not found
    patch:
      tags:
        - Salons
      summary: Update salon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalonRequest'
      responses:
        '200':
          description: Salon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Salon not found
    delete:
      tags:
        - Salons
      summary: Delete salon
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Salon deleted
        '400':
          description: Invalid salon ID
        '401':
          description: Unauthorized

  # ==================== SERVICES ====================
  /services:
    post:
      tags:
        - Services
      summary: Create a new service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    get:
      tags:
        - Services
      summary: List services by salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /services/active:
    get:
      tags:
        - Services
      summary: List active services by salon
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /services/by-user:
    get:
      tags:
        - Services
      summary: List services by user
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /services/by-salon-and-user:
    get:
      tags:
        - Services
      summary: List services by salon and user
      description: Returns services assigned to a specific user plus unassigned services
      security:
        - bearerAuth: []
      parameters:
        - name: salon_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Services for salon and user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /services/{id}:
    get:
      tags:
        - Services
      summary: Get service by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Invalid service ID
        '401':
          description: Unauthorized
        '404':
          description: Service not found
    patch:
      tags:
        - Services
      summary: Update service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Service not found
    delete:
      tags:
        - Services
      summary: Delete service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Service deleted
        '400':
          description: Invalid service ID
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: securepassword123
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+1234567890"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
      description: Authentication response. Tokens are set as HTTP-only cookies, not returned in body.

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: "Jane Doe"
          description: New display name
        phone:
          type: string
          example: "+1987654321"
          description: New phone number
        email:
          type: string
          format: email
          example: "newemail@example.com"
          description: New email address
      description: At least one field must be provided

    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, owner, employee, customer]
        salon_id:
          type: string
          format: uuid
          nullable: true
        onboarding_completed:
          type: boolean
          description: Whether the user has completed onboarding
        current_onboarding_step:
          type: integer
          nullable: true
          description: The user's current onboarding step ID

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, owner, employee, customer]
        salon_id:
          type: string
          format: uuid
          nullable: true
        onboarding_completed:
          type: boolean
          description: Whether the user has completed onboarding
        current_onboarding_step:
          type: integer
          nullable: true
          description: The user's current onboarding step ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactFormRequest:
      type: object
      required:
        - full_name
        - email
        - subject
        - message
      properties:
        full_name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone_number:
          type: string
          example: "+1234567890"
        salon_name:
          type: string
          example: "John's Salon"
        subject:
          type: string
          enum: [support, sales, partnership]
          example: support
          description: The subject/category of the contact form
        message:
          type: string
          example: I would like to learn more about your services.

    ContactFormResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
          nullable: true
        salon_name:
          type: string
          nullable: true
        subject:
          type: string
          enum: [support, sales, partnership]
        message:
          type: string
        responded:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OnboardingStep:
      type: object
      properties:
        id:
          type: integer
          example: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingOption'

    OnboardingOption:
      type: object
      properties:
        id:
          type: integer
        option_index:
          type: integer
          example: 1

    UserSelection:
      type: object
      properties:
        step_id:
          type: integer
          example: 2
        option_indices:
          type: array
          items:
            type: integer
          example: [1, 3, 6]

    OnboardingProgressResponse:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        user_selections:
          type: array
          items:
            $ref: '#/components/schemas/UserSelection'
        current_step:
          type: integer
          nullable: true
          example: 3
        completed:
          type: boolean
          example: false

    OnboardingSelectionRequest:
      type: object
      required:
        - step_id
        - option_indices
      properties:
        step_id:
          type: integer
          example: 2
        option_indices:
          type: array
          items:
            type: integer
          minItems: 1
          example: [1, 3, 6]

    SaveOnboardingStepRequest:
      type: object
      required:
        - step_id
        - option_indices
      properties:
        step_id:
          type: integer
          example: 2
          description: The step ID being saved
        option_indices:
          type: array
          items:
            type: integer
          minItems: 1
          example: [1, 3, 6]
          description: Array of selected option indices for this step
        is_last_step:
          type: boolean
          example: false
          description: Set to true on the final step to mark onboarding as completed (sets onboarding_completed_at)

    SaveOnboardingRequest:
      type: object
      required:
        - selections
      properties:
        selections:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingSelectionRequest'
          minItems: 1
        completed:
          type: boolean
          example: true
          description: Whether the user has completed all onboarding steps

    # ==================== CLIENT SCHEMAS ====================
    CreateClientRequest:
      type: object
      required:
        - salon_id
        - name
        - phone
      properties:
        salon_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          example: "Maria Silva"
        phone:
          type: string
          example: "+5511999999999"
        email:
          type: string
          format: email
          example: "maria@example.com"
        birthday:
          type: string
          format: date-time
          example: "1990-05-15T00:00:00Z"

    UpdateClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
          format: email
        birthday:
          type: string
          format: date-time

    ClientResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        salon_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        birthday:
          type: string
          format: date-time
          nullable: true
        total_appointments:
          type: integer
        last_appointment:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ==================== APPOINTMENT SCHEMAS ====================
    CreateAppointmentRequest:
      type: object
      required:
        - salon_id
        - user_id
        - service_id
        - client_name
        - client_phone
        - date
        - start_time
        - end_time
      properties:
        salon_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: The user (professional) assigned to the appointment
        service_id:
          type: string
          format: uuid
        client_name:
          type: string
          minLength: 1
          example: "Maria Silva"
        client_phone:
          type: string
          example: "+5511999999999"
        client_email:
          type: string
          format: email
        date:
          type: string
          format: date
          example: "2025-01-15"
        start_time:
          type: string
          example: "09:00"
          description: Time in HH:MM format
        end_time:
          type: string
          example: "10:00"
          description: Time in HH:MM format
        status:
          type: string
          enum: [pending, confirmed, cancelled, done, no-show]
          default: pending
        notes:
          type: string

    UpdateAppointmentRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
          description: Time in HH:MM format
        end_time:
          type: string
          description: Time in HH:MM format
        status:
          type: string
          enum: [pending, confirmed, cancelled, done, no-show]
        notes:
          type: string

    UpdateAppointmentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled, done, no-show]

    AppointmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        salon_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        client_name:
          type: string
        client_phone:
          type: string
        client_email:
          type: string
          nullable: true
        date:
          type: string
          format: date
        start_time:
          type: string
          description: Time in HH:MM format
        end_time:
          type: string
          description: Time in HH:MM format
        status:
          type: string
          enum: [pending, confirmed, cancelled, done, no-show]
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ==================== SALON SCHEMAS ====================
    CreateSalonRequest:
      type: object
      required:
        - name
        - slug
        - owner_id
        - address
      properties:
        name:
          type: string
          minLength: 1
          example: "Beauty Studio"
        slug:
          type: string
          minLength: 1
          example: "beauty-studio"
          description: URL-friendly identifier
        owner_id:
          type: string
          format: uuid
        address:
          type: string
          example: "123 Main St, City"
        whatsapp:
          type: string
          example: "+5511999999999"
        business_hours:
          type: object
          description: JSON object with business hours per day
          example:
            monday: ["09:00-12:00", "14:00-18:00"]
            tuesday: ["09:00-12:00", "14:00-18:00"]
        logo_url:
          type: string
          format: uri

    UpdateSalonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        address:
          type: string
        whatsapp:
          type: string
        business_hours:
          type: object
        logo_url:
          type: string
          format: uri

    SalonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        owner_id:
          type: string
          format: uuid
        address:
          type: string
        whatsapp:
          type: string
          nullable: true
        timezone:
          type: string
          example: "UTC"
        business_hours:
          type: object
        logo_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== SERVICE SCHEMAS ====================
    CreateServiceRequest:
      type: object
      required:
        - salon_id
        - name
        - duration
        - price
      properties:
        salon_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Optional user (professional) this service is assigned to
        name:
          type: string
          minLength: 1
          example: "Haircut"
        duration:
          type: integer
          minimum: 1
          example: 30
          description: Duration in minutes
        price:
          type: integer
          minimum: 0
          example: 5000
          description: Price in cents
        active:
          type: boolean
          default: true

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 1
          description: Duration in minutes
        price:
          type: integer
          minimum: 0
          description: Price in cents
        active:
          type: boolean
        user_id:
          type: string
          format: uuid

    ServiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        salon_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        duration:
          type: integer
          description: Duration in minutes
        price:
          type: integer
          description: Price in cents
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
