openapi: 3.1.0
info:
  title: Parlor API
  description: API for Parlor salon management and appointment booking system
  version: 1.0.0
  contact:
    name: Parlor Harpia API Docs
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication endpoints
  - name: SSO
    description: Single Sign-On (OAuth2) endpoints
  - name: Profile
    description: User profile endpoints
  - name: Contact Form
    description: Contact form endpoints
  - name: Onboarding
    description: User onboarding endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API and database
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "up"
                  message:
                    type: string
                    example: "It's healthy"

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request - invalid input
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user and returns a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the currently authenticated user's information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  /profile:
    get:
      tags:
        - Profile
      summary: Get user profile
      description: Returns the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
    patch:
      tags:
        - Profile
      summary: Update user profile
      description: Updates the authenticated user's profile information. At least one field must be provided.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Bad request - invalid input or no fields provided
        '401':
          description: Unauthorized
        '409':
          description: Email already in use

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Invalidates the current JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Uses the refresh token cookie to issue a new access token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token not found or invalid

  /auth/google:
    get:
      tags:
        - SSO
      summary: Google OAuth2 login
      description: Redirects to Google OAuth2 consent page
      responses:
        '307':
          description: Redirect to Google OAuth2

  /auth/google/callback:
    get:
      tags:
        - SSO
      summary: Google OAuth2 callback
      description: Handles the OAuth2 callback from Google
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '307':
          description: |
            Redirect to frontend with onboarding status.
            Redirect URL format: {FRONTEND_URL}/auth/callback?onboardingCompleted={true|false}&onboardingStep={step_id}
            - onboardingCompleted: Whether the user has completed onboarding
            - onboardingStep: Current onboarding step ID (only present if user has started onboarding)
        '400':
          description: Missing authorization code
        '500':
          description: Failed to exchange token or get user info

  /contact-form:
    post:
      tags:
        - Contact Form
      summary: Submit contact form
      description: Creates a new contact form submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormRequest'
      responses:
        '201':
          description: Contact form submitted successfully
        '400':
          description: Bad request - invalid input
    get:
      tags:
        - Contact Form
      summary: List contact forms
      description: Returns all contact form submissions
      responses:
        '200':
          description: List of contact forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactFormResponse'

  /onboarding:
    get:
      tags:
        - Onboarding
      summary: Get onboarding steps and user progress
      description: Returns all onboarding steps with their options and the user's current progress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgressResponse'
        '401':
          description: Unauthorized
    post:
      tags:
        - Onboarding
      summary: Save onboarding selections (batch)
      description: Saves multiple onboarding steps at once. Use POST /onboarding/step for single-step saves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOnboardingRequest'
      responses:
        '200':
          description: Onboarding selections saved successfully
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized

  /onboarding/step:
    post:
      tags:
        - Onboarding
      summary: Save single onboarding step (performant)
      description: |
        Saves a single onboarding step with its selections in a single transaction.
        More performant than batch endpoint for step-by-step onboarding flow.
        Sets is_last_step=true on the final step to mark onboarding as completed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOnboardingStepRequest'
      responses:
        '200':
          description: Step saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "step saved successfully"
                  step_id:
                    type: integer
                    example: 2
                  completed:
                    type: boolean
                    example: false
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: securepassword123
        name:
          type: string
          example: John Doe
        phone:
          type: string
          example: "+1234567890"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
      description: Authentication response. Tokens are set as HTTP-only cookies, not returned in body.

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: "Jane Doe"
          description: New display name
        phone:
          type: string
          example: "+1987654321"
          description: New phone number
        email:
          type: string
          format: email
          example: "newemail@example.com"
          description: New email address
      description: At least one field must be provided

    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, owner, employee, customer]
        salon_id:
          type: string
          format: uuid
          nullable: true
        onboarding_completed:
          type: boolean
          description: Whether the user has completed onboarding
        current_onboarding_step:
          type: integer
          nullable: true
          description: The user's current onboarding step ID

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, owner, employee, customer]
        salon_id:
          type: string
          format: uuid
          nullable: true
        onboarding_completed:
          type: boolean
          description: Whether the user has completed onboarding
        current_onboarding_step:
          type: integer
          nullable: true
          description: The user's current onboarding step ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactFormRequest:
      type: object
      required:
        - full_name
        - email
        - subject
        - message
      properties:
        full_name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone_number:
          type: string
          example: "+1234567890"
        salon_name:
          type: string
          example: "John's Salon"
        subject:
          type: string
          enum: [support, sales, partnership]
          example: support
          description: The subject/category of the contact form
        message:
          type: string
          example: I would like to learn more about your services.

    ContactFormResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
          nullable: true
        salon_name:
          type: string
          nullable: true
        subject:
          type: string
          enum: [support, sales, partnership]
        message:
          type: string
        responded:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OnboardingStep:
      type: object
      properties:
        id:
          type: integer
          example: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingOption'

    OnboardingOption:
      type: object
      properties:
        id:
          type: integer
        option_index:
          type: integer
          example: 1

    UserSelection:
      type: object
      properties:
        step_id:
          type: integer
          example: 2
        option_indices:
          type: array
          items:
            type: integer
          example: [1, 3, 6]

    OnboardingProgressResponse:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        user_selections:
          type: array
          items:
            $ref: '#/components/schemas/UserSelection'
        current_step:
          type: integer
          nullable: true
          example: 3
        completed:
          type: boolean
          example: false

    OnboardingSelectionRequest:
      type: object
      required:
        - step_id
        - option_indices
      properties:
        step_id:
          type: integer
          example: 2
        option_indices:
          type: array
          items:
            type: integer
          minItems: 1
          example: [1, 3, 6]

    SaveOnboardingStepRequest:
      type: object
      required:
        - step_id
        - option_indices
      properties:
        step_id:
          type: integer
          example: 2
          description: The step ID being saved
        option_indices:
          type: array
          items:
            type: integer
          minItems: 1
          example: [1, 3, 6]
          description: Array of selected option indices for this step
        is_last_step:
          type: boolean
          example: false
          description: Set to true on the final step to mark onboarding as completed (sets onboarding_completed_at)

    SaveOnboardingRequest:
      type: object
      required:
        - selections
      properties:
        selections:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingSelectionRequest'
          minItems: 1
        completed:
          type: boolean
          example: true
          description: Whether the user has completed all onboarding steps
