services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - ${PORT}:${PORT}
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
    depends_on:
      psql:
        condition: service_healthy
    networks:
      - network_api_core
  psql:
    image: postgres:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume:/var/lib/postgresql/MAJOR/docker
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - network_api_core
  file_storage:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/file_storage.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/storage:/var/www/file_storage:ro
      - ./nginx/access.log:/var/log/nginx/file_storage.access.log:ro
      - ./nginx/error.log:/var/log/nginx/file_storage.error.log:ro
    networks:
      - network_api_core
    healthcheck:
      test: [ "CMD-SHELL", "nginx -t -q" ]
      interval: 30s
      timeout: 10s
      retries: 3

    redis:
      image: redis:7.4.3
      restart: unless-stopped
      env_file:
        - .env
      environment:
        - REDIS_PORT=${REDIS_PORT}
      ports:
        - ${REDIS_PORT}:${REDIS_PORT}
      healthcheck:
        test: ["CMD", "redis-cli", "-a", $REDIS_PASSWORD, "ping"]
        interval: 5s
        timeout: 5s
        retries: 10
      command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --port ${REDIS_PORT} --protected-mode yes 
      networks:
        - network_api_core

volumes:
  psql_volume:
  redis_data:
networks:
  network_api_core:
